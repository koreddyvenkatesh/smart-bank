spring.application.name=BankManagement

server.port=8081


# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/smartbankmanagment
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration (Referenced in JwtService.java)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Mail Configuration (Referenced for OTPs and Temp Passwords)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

